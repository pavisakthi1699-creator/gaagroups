<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--app-head-->
    <script>
      /* Laptops, desktops and TVs show the site scaled from a 1548 px layout (see src/ScaledSite.jsx).
         This runs before the page paints so the unscaled page never flashes. */
      (function () {
        var d = document.documentElement, f = false;
        try { f = window.self !== window.top; } catch (e) { f = true; }
        var adm = /^\/admin(\/|$)/.test(location.pathname);
        if (adm) d.className += " admin";
        else if (f) d.className += " in-frame";
        else if (window.innerWidth >= 900) d.className += " framed";
      })();
    </script>
    <style>
      html.framed, html.framed body { height: 100%; overflow: hidden !important; }
      html.framed #root > *:not(#site-frame) { display: none !important; }
      #site-frame { position: fixed; left: 0; top: 0; border: 0; background: #fff; transform-origin: 0 0; display: block; }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
